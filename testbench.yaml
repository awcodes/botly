laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\Filament\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

env:
  - AUTH_MODEL='Workbench\App\Models\User'

purge:
  files:
    - database/migrations/*_create_botly_table.php

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - filament-assets
    - create-sqlite-db
    - vendor-publish:
        --tag: botly-migrations
        --force: true
    - workbench:assert-botly-migration
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
